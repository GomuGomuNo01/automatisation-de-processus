name: Deploy Présentation → GitHub Pages

# Publie assets/video/ (page, vidéo, affiche, musique) sur
# https://gomugomuno01.github.io/automatisation-de-processus/presentation/
on:
  push:
    branches: [main]
    paths:
      - "assets/video/**"
      - "!assets/video/source/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:   # déclenchement manuel possible

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        # enablement: true : l'action active GitHub Pages elle-même si le dépôt
        # n'a pas encore de site (sinon il faut Settings > Pages > Source : GitHub Actions).
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Assemble site (page de présentation)
        run: |
          mkdir -p _site/presentation
          cp assets/video/index.html assets/video/Relais_presentation.mp4 assets/video/presentation-poster.jpg assets/video/musique.mp3 _site/presentation/
          printf '%s\n' '<!doctype html>' '<html lang="fr"><head><meta charset="utf-8">' '<title>Relais</title>' '<meta http-equiv="refresh" content="0; url=./presentation/"></head>' '<body style="background:#0a0d0c;color:#edf2ec;font-family:system-ui,sans-serif;padding:40px">' '<p><a href="./presentation/" style="color:#cff24a">Voir la présentation vidéo de Relais</a></p>' '</body></html>' > _site/index.html

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
